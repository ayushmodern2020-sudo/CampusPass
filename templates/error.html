{% extends 'base.html' %}
{% block content %}
<div class="error-page">
    <span class="eyebrow">OOPS / {{ title }}</span>
    <h1>{{ title }}</h1>
    <p class="lead dark-lead">{{ message }}</p>
    {% if student_authenticated %}
        <a class="button" href="{{ url_for('events') }}">Back to events</a>
    {% elif admin_authenticated %}
        <a class="button" href="{{ url_for('organizer') }}">Back to dashboard</a>
    {% else %}
        <a class="button" href="{{ url_for('student_login') }}">Student login</a>
    {% endif %}
</div>
{% endblock %}
