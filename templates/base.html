<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>{{ title or app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="nav">
    <a class="brand" href="{{ url_for('events') if student_authenticated else url_for('organizer') if admin_authenticated else url_for('student_login') }}">
        <span class="brand-mark">CP</span>
        <span>{{ app_name }}</span>
    </a>
    <div class="nav-links">
        {% if student_authenticated %}
            <a href="{{ url_for('events') }}">Events</a>
            <a href="{{ url_for('my_tickets') }}">My Tickets</a>
            <span class="nav-user">{{ student_name }}</span>
            <form method="post" action="{{ url_for('student_logout') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <button class="nav-button" type="submit">Sign out</button>
            </form>
        {% elif admin_authenticated %}
            <a href="{{ url_for('organizer') }}">Dashboard</a>
            <a href="{{ url_for('create_event') }}">Create event</a>
            <span class="nav-user">{{ admin_username }}</span>
            <form method="post" action="{{ url_for('admin_logout') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <button class="nav-button" type="submit">Sign out</button>
            </form>
        {% endif %}
    </div>
</nav>
<main class="page">{% block content %}{% endblock %}</main>
<footer class="footer">CampusPass · events worth showing up for</footer>
</body>
</html>
